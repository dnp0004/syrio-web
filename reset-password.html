<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-width=1.0">
  <title>Restablecer Contraseña - Syrio</title>
  <style>
    body {
      font-family: 'Nunito', sans-serif;
      background-color: #F8F4EE;
      color: #3E2919;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .container {
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.05);
      width: 100%;
      max-width: 400px;
      text-align: center;
    }
    h2 {
      color: #D36E35;
      margin-bottom: 20px;
    }
    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border: 1px solid #ddd;
      border-radius: 10px;
      box-sizing: border-box;
      font-size: 16px;
    }
    button {
      background-color: #D36E35;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 10px;
      width: 100%;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s;
    }
    button:hover {
      background-color: #B55928;
    }
    #message {
      margin-top: 15px;
      font-size: 14px;
    }
    .success {
      color: #2e7d32;
    }
    .error {
      color: #d32f2f;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="container">
    <h2>Nueva contraseña</h2>
    <p style="font-size: 14px; margin-bottom: 20px; color: #666;">Introduce tu nueva contraseña para tu cuenta de Syrio.</p>
    
    <div id="form-container">
      <input type="password" id="password" placeholder="Nueva contraseña (mínimo 6 caracteres)" required minlength="6">
      <button onclick="resetPassword()">Cambiar contraseña</button>
    </div>
    
    <p id="message"></p>
  </div>

  <script>
    // Inicializar Supabase
    const SUPABASE_URL = 'https://ffverpxoeybhavtbultl.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZmdmVycHhvZXliaGF2dGJ1bHRsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY2OTk3MDUsImV4cCI6MjA5MjI3NTcwNX0.ZRe052PAMJ9rBxTw01BGajmnPvvmsnHehjPoVm8Yhxk';
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function resetPassword() {
      const password = document.getElementById('password').value;
      const messageEl = document.getElementById('message');
      
      if(password.length < 6) {
        messageEl.textContent = 'La contraseña debe tener al menos 6 caracteres.';
        messageEl.className = 'error';
        return;
      }

      messageEl.textContent = 'Cambiando contraseña...';
      messageEl.className = '';

      // La URL vendrá con un hash tipo #access_token=...&type=recovery
      // Supabase automáticamente lee la sesión de esa URL hash.
      const { error } = await supabase.auth.updateUser({
        password: password
      });

      if (error) {
        messageEl.textContent = 'Error: ' + error.message;
        messageEl.className = 'error';
      } else {
        messageEl.textContent = '¡Contraseña cambiada con éxito! Ya puedes cerrar esta ventana y entrar en la app de Syrio con tu nueva clave.';
        messageEl.className = 'success';
        document.getElementById('form-container').style.display = 'none';
      }
    }
  </script>
</body>
</html>
